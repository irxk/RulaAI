<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rula</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside id="sidebar">
  <button id="new-chat" class="new-chat" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    新しいチャット
  </button>
  <nav id="chat-list" aria-label="チャット履歴"></nav>
  <div class="side-foot">
    <span id="model-dot" class="dot loading"></span>
    <span id="model-name">読み込み中…</span>
  </div>
</aside>

<main>
  <header>
    <button id="toggle-side" class="icon-btn" type="button" title="サイドバーの表示切り替え">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <div id="chat-title"></div>
    <div id="badges"></div>
  </header>

  <section id="scroller">
    <div id="messages">
      <div id="empty" class="empty">
        <div class="logo">Rula</div>
        <p>何でも聞いてください。画像はドラッグ＆ドロップや貼り付けでも渡せます。</p>
        <div class="chips">
          <button type="button" class="chip">日本で2番目に高い山は?</button>
          <button type="button" class="chip">クリスマスまであと何日?</button>
          <button type="button" class="chip">PythonとRubyの違いを一言で</button>
          <button type="button" class="chip">量子コンピュータとは</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <form id="composer" class="composer" autocomplete="off">
      <div id="attach-preview" class="attach-preview" hidden>
        <img id="attach-img" alt="添付画像">
        <button id="attach-remove" class="attach-remove" type="button" title="添付を外す">×</button>
      </div>
      <textarea id="input" rows="1" placeholder="メッセージを入力 (Enterで送信 / Shift+Enterで改行)"></textarea>
      <div class="row">
        <button id="attach" class="icon-btn" type="button" title="画像を添付">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.4 8.4a5 5 0 0 1-7.1-7.1l8.8-8.8a3.3 3.3 0 0 1 4.7 4.7l-8.8 8.8a1.7 1.7 0 0 1-2.4-2.4l8.1-8.1"/></svg>
        </button>
        <button id="think" class="pill" type="button" aria-pressed="false" title="答える前に考えます。正確になりますが遅くなります">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
          考える
        </button>
        <span id="hint" class="hint"></span>
        <button id="send" class="send" type="submit" title="送信" disabled>
          <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </form>
  </footer>
</main>

<div id="drop" class="drop" hidden><div>画像をドロップして添付</div></div>

<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
